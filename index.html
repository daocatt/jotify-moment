<!DOCTYPE html>
<html lang="zh" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- TITLE -->
    <!-- SEO_META -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/api/favicon" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        var t = localStorage.getItem("active-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        var m = localStorage.getItem("theme");
        var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (m === "dark" || (!m && d)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-background text-foreground relative">
    <div id="root"><!-- SSR_CONTENT --></div>
    <!-- SSR_DATA -->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
