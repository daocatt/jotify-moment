name: Production CD (Jotify Moment)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          script: |
            set -e
            set -o pipefail

            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"
            ENV_FILE="${{ secrets.VPS_ENV_FILE }}"

            cd "$PROJECT_PATH"
            git fetch --all
            echo "🚀 Deployment started at $(date) — commit $(git rev-parse --short origin/main)"

            # 1. Sync code
            git checkout -B main origin/main
            git reset --hard origin/main

            # 2. Prepare env
            cp "$ENV_FILE" .env

            # 3. Build Docker images — if the build fails, STOP (never silently
            #    keep the previous image and call it a success).
            echo "📦 Building new Docker images..."
            if ! docker compose build --no-cache >/tmp/dc-build.log 2>&1; then
              echo "❌ Build failed — deployment aborted. Last build output:"
              tail -80 /tmp/dc-build.log | grep -vE '(DATABASE_URL|BETTER_AUTH_SECRET|POSTGRES_PASSWORD)'
              exit 1
            fi

            # 4. Start database
            echo "🗄️ Bootstrapping database..."
            docker compose up -d db
            sleep 3

            # 5. Start all services
            echo "🚀 Starting containers..."
            docker compose up -d

            # 6. Cleanup
            docker image prune -f

            echo "✅ Deployment successful! (commit $(git rev-parse --short HEAD))"
